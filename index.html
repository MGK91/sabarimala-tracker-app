<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sabarimala Route Risk Monitor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
      --border: #334155;
      --purple: #a855f7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
    }
    header {
      padding: 1.5rem 0 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.15rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.75rem; margin-top: 0.25rem; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      display: inline-block; margin-right: 6px;
    }
    .status-dot.offline { background: var(--orange); }

    .tab-bar {
      display: flex; gap: 0.5rem; margin-bottom: 1rem;
      border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;
    }
    .tab-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 0.5rem 0.75rem;
      border-radius: 8px; font-size: 0.75rem; cursor: pointer;
      flex: 1; text-align: center; font-weight: 600;
    }
    .tab-btn.active {
      background: var(--card); color: var(--text); border-color: var(--muted);
    }
    .tab-btn:active { opacity: 0.7; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* District Cards */
    .district-grid {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .district-card {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem;
      border-left: 4px solid var(--green);
      transition: all 0.3s ease;
    }
    .district-card.orange { border-left-color: var(--orange); }
    .district-card.red { border-left-color: var(--red); }
    .district-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.5rem;
    }
    .district-name { font-weight: 600; font-size: 1rem; }
    .badge {
      padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.7rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      background: rgba(34,197,94,0.15); color: var(--green);
    }
    .badge.orange { background: rgba(245,158,11,0.15); color: var(--orange); }
    .badge.red { background: rgba(239,68,68,0.15); color: var(--red); }
    .landslide-badge {
      padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.6rem;
      font-weight: 700; text-transform: uppercase;
      background: rgba(168,85,247,0.15); color: var(--purple);
      margin-left: 0.5rem;
    }
    .landslide-badge.high { background: rgba(239,68,68,0.15); color: var(--red); }
    .landslide-badge.moderate { background: rgba(245,158,11,0.15); color: var(--orange); }
    .rainfall-row {
      display: flex; gap: 0.5rem; margin-top: 0.5rem;
    }
    .rainfall-item {
      flex: 1; background: rgba(255,255,255,0.03);
      padding: 0.5rem; border-radius: 8px; text-align: center;
    }
    .rainfall-value { font-size: 1rem; font-weight: 700; }
    .rainfall-label { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; }
    .threshold-bar {
      margin-top: 0.4rem;
      height: 3px; background: var(--border); border-radius: 2px;
      overflow: hidden;
    }
    .threshold-fill {
      height: 100%; border-radius: 2px;
      background: var(--green); transition: width 0.5s ease;
    }
    .threshold-fill.orange { background: var(--orange); }
    .threshold-fill.red { background: var(--red); }
    .alert-text {
      font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem;
      font-style: italic;
    }

    /* Route Points */
    .route-section-title {
      font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 1.25rem 0 0.75rem;
    }
    .route-list {
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .route-item {
      background: var(--card); border-radius: 10px; padding: 0.75rem;
      display: flex; align-items: center; gap: 0.75rem;
      border-left: 3px solid var(--border);
    }
    .route-item.green { border-left-color: var(--green); }
    .route-item.orange { border-left-color: var(--orange); }
    .route-item.red { border-left-color: var(--red); }
    .route-icon {
      font-size: 1.25rem; width: 32px; text-align: center;
    }
    .route-info { flex: 1; }
    .route-name { font-weight: 600; font-size: 0.9rem; }
    .route-meta {
      font-size: 0.65rem; color: var(--muted);
      margin-top: 0.1rem;
    }
    .route-rain {
      text-align: right;
    }
    .route-rain-val {
      font-size: 0.9rem; font-weight: 700;
    }
    .route-rain-label {
      font-size: 0.55rem; color: var(--muted); text-transform: uppercase;
    }

    /* Alerts */
    .section-title {
      font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 1.5rem 0 0.75rem;
    }
    .alert-list {
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .alert-item {
      background: var(--card); border-radius: 10px; padding: 0.875rem;
      border-left: 3px solid var(--border);
      animation: slideIn 0.3s ease;
    }
    .alert-item.green { border-left-color: var(--green); }
    .alert-item.orange { border-left-color: var(--orange); }
    .alert-item.red { border-left-color: var(--red); }
    .alert-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.25rem;
    }
    .alert-source {
      font-size: 0.65rem; color: var(--muted); text-transform: uppercase;
      font-weight: 600;
    }
    .alert-time { font-size: 0.65rem; color: var(--muted); }
    .alert-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .alert-body { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }

    /* Map */
    #map {
      height: 65vh;
      min-height: 400px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .leaflet-container { background: var(--bg); }
    .leaflet-popup-content-wrapper {
      background: var(--card); color: var(--text); border-radius: 8px;
      border: 1px solid var(--border);
    }
    .leaflet-popup-tip { background: var(--card); }
    .leaflet-popup-content { margin: 8px 12px; font-size: 0.8rem; }
    .map-legend {
      display: flex; gap: 1rem; justify-content: center;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .legend-item {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.75rem; color: var(--muted);
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .legend-dot.green { background: var(--green); }
    .legend-dot.orange { background: var(--orange); }
    .legend-dot.red { background: var(--red); }

    .refresh-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 0.4rem 0.8rem;
      border-radius: 8px; font-size: 0.75rem; cursor: pointer;
    }
    .refresh-btn:active { opacity: 0.7; }

    .empty-state {
      text-align: center; padding: 2rem; color: var(--muted);
    }

    .info-card {
      background: var(--card); border-radius: 12px; padding: 1rem;
      font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem;
    }
    .info-card b { color: var(--text); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🛕 Sabarimala Route Risk</h1>
      <div class="subtitle">Chennai → Theni → Kumily → Erumely → Pamba → Sabarimala</div>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem;">
      <span id="conn-status"><span class="status-dot"></span>Live</span>
      <button class="refresh-btn" onclick="app.refresh()">↻ Refresh</button>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="app.switchTab('dashboard')" id="tab-dashboard">Dashboard</button>
    <button class="tab-btn" onclick="app.switchTab('route')" id="tab-route">Route</button>
    <button class="tab-btn" onclick="app.switchTab('map')" id="tab-map">Map</button>
    <button class="tab-btn" onclick="app.switchTab('alerts')" id="tab-alerts">Alerts</button>
  </div>

  <!-- Dashboard Tab -->
  <div id="panel-dashboard" class="tab-panel active">
    <div id="districts" class="district-grid"></div>
    <div class="info-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:0.5rem;">
        <span>24h trigger</span><b>≥ 115 mm</b>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:0.5rem;">
        <span>3-day trigger</span><b>≥ 200 mm</b>
      </div>
      <div style="display:flex;justify-content:space-between;">
        <span>7-day trigger</span><b>≥ 350 mm</b>
      </div>
      <div style="margin-top:0.75rem;font-size:0.7rem;opacity:0.7;">
        Sources: Sachet/NDMA · IMD · GSI Bhusanket · Kerala SDMA · INCOIS · CWC · Open-Meteo
      </div>
    </div>
  </div>

  <!-- Route Tab -->
  <div id="panel-route" class="tab-panel">
    <div class="route-section-title">Chennai → Sabarimala Route</div>
    <div id="route-points" class="route-list"></div>
  </div>

  <!-- Map Tab -->
  <div id="panel-map" class="tab-panel">
    <div class="map-legend">
      <div class="legend-item"><div class="legend-dot green"></div> Safe</div>
      <div class="legend-item"><div class="legend-dot orange"></div> Caution</div>
      <div class="legend-item"><div class="legend-dot red"></div> Danger</div>
      <div class="legend-item" style="opacity:0.5;">🛕 Temple</div>
      <div class="legend-item" style="opacity:0.5;">🏔️ Pass</div>
    </div>
    <div id="map"></div>
  </div>

  <!-- Alerts Tab -->
  <div id="panel-alerts" class="tab-panel">
    <div id="alerts-list" class="alert-list"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
