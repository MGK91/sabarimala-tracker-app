# --- Polling Intervals ---
intervals:
  risk_poller_hours: 1
  digest_hour: 8  # UTC

# --- Data Sources ---
sources:
  sachet:
    enabled: true
    url: "https://sachet.ndma.gov.in/cap_public_website/Feeds/atom"
    states: ["Kerala", "Tamil Nadu"]
  imd:
    enabled: true
    # Scrapes: district warnings, nowcast, subdivision warnings
    district_warning_url: "https://mausam.imd.gov.in/imd_latest/contents/districtwise-warning.php"
    nowcast_url: "https://mausam.imd.gov.in/imd_latest/contents/districtwise-nowcast.php"
    subdivision_url: "https://mausam.imd.gov.in/imd_latest/contents/subdivisionwise-warning.php"
  gsi:
    enabled: true
    portal_url: "https://www.gsi.gov.in/webcenter/portal/GeologicalSurveyofIndia/pages_bhukamp"
    bhooskhalan_url: "https://bhukamp.gsi.gov.in/"
  kerala_sdma:
    enabled: true
    bulletin_url: "https://sdma.kerala.gov.in/"
    landslide_url: "https://sdma.kerala.gov.in/landslide/"
  incois:
    enabled: true
    # Coastal swell / Kallakkadal warnings for Kerala
    url: "https://incois.gov.in/portal/osf/osf.jsp"
    alert_url: "https://incois.gov.in/portal/osf/kallakkadal.jsp"
  cwc:
    enabled: true
    # Central Water Commission flood forecasting
    flood_url: "https://ffs.india-water.gov.in/"
  open_meteo:
    enabled: true
    forecast_days: 7
