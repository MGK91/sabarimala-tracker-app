# Sabarimala Risk Poller — Chennai to Sabarimala Route Monitoring

# --- Telegram Notifications ---
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# --- WhatsApp Notifications ---
whatsapp:
  enabled: true
  mode: "cloud_api"
  access_token: "${WHATSAPP_ACCESS_TOKEN}"
  phone_number_id: "${WHATSAPP_PHONE_NUMBER_ID}"
  recipient_phone: "919876543210"
  webhook_url: ""
  webhook_secret: ""
  click_to_chat_number: "919876543210"

# --- ntfy.sh Fallback ---
ntfy:
  topic: "sabarimala-risk"

# --- Rainfall Thresholds (Western Ghats landslide triggers) ---
thresholds:
  daily_max: 115        # 24h mm — red alert
  three_day_max: 200   # 3-day antecedent mm — red alert
  seven_day_max: 350    # 7-day accumulated mm — red alert

# --- Districts (for aggregation and alerts) ---
districts:
  - name: "Idukki"
    locations:
      - name: "Kumily"
        lat: 9.6000
        lon: 77.1667
      - name: "Vandiperiyar"
        lat: 9.5167
        lon: 77.0833
      - name: "Gavi"
        lat: 9.3833
        lon: 77.0500
    weight: 1.0
  - name: "Pathanamthitta"
    locations:
      - name: "Erumely"
        lat: 9.4833
        lon: 76.7833
      - name: "Pamba"
        lat: 9.3667
        lon: 77.0833
      - name: "Sabarimala"
        lat: 9.4325
        lon: 77.0825
    weight: 1.0
  - name: "Theni"
    locations:
      - name: "Theni"
        lat: 10.0167
        lon: 77.4833
      - name: "Bodinayakanur"
        lat: 10.0167
        lon: 77.3500
    weight: 0.8
  - name: "Kottayam"
    locations:
      - name: "Kottayam"
        lat: 9.5833
        lon: 76.5167
    weight: 0.6
  - name: "Ernakulam"
    locations:
      - name: "Munnar"
        lat: 10.0892
        lon: 77.0597
    weight: 0.5

